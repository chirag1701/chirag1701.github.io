{%- assign p = include.post -%}
<div class="post-meta"><span>{{ p.date | date: "%B %-d, %Y" }}{% if p.tags.size > 0 %}&nbsp;│ {% for tag in p.tags %}<a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}</span></div>
