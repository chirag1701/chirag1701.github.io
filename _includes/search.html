{%- assign host = site.url | remove: "https://" | remove: "http://" | append: site.baseurl -%}
<div class="search-container"><form class="site-search" action="https://www.google.com/search" target="_blank" rel="noopener"><label for="site-search-input" class="sr-only">Search {{ host }}</label><input type="text" id="site-search-input" name="q" placeholder="Search posts"><input type="hidden" name="as_sitesearch" value="{{ host }}"><button type="submit">Search</button></form></div>
<script>
document.querySelector(".site-search").addEventListener("submit", function (event) {
  event.preventDefault()
  var query = event.target.q.value.trim()
  var siteQuery = "site:{{ host }}" + (query ? " " + query : "")
  window.open("https://www.google.com/search?q=" + encodeURIComponent(siteQuery), "_blank", "noopener,noreferrer")
})
</script>
