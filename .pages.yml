# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Lets you write posts at https://app.pagescms.org instead of editing files by hand.

media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, published, tags]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: published
        label: Published (visible on the site)
        description: Leave off while you're still writing. Turn on and Save to post it.
        type: boolean
        default: false
      - name: tags
        label: Tags
        description: e.g. ai, careers, life
        type: string
        list: true
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  - name: about
    label: Homepage (about me)
    type: file
    path: about.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: home
      - name: title
        label: Title
        type: string
        default: About
      - name: permalink
        type: string
        hidden: true
        default: /
      - name: body
        label: About me
        type: rich-text
        options:
          format: markdown
