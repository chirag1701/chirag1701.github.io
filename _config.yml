# ---------------------------------------------------------------
# Site settings — edit these to make the site yours
# ---------------------------------------------------------------
title: chirag sindhwani            # shown as the big header (lowercase, like the original)
author: Chirag Sindhwani
description: Chirag Sindhwani's blog — notes on software, engineering and whatever else I'm thinking about.

# If your repo is named <username>.github.io, leave baseurl empty.
# If it's any other repo name (e.g. "blog"), set baseurl: "/blog".
url: "https://chirag1701.github.io"
baseurl: ""

# Links shown in the menu row under your name.
# External links open in a new tab. Remove or add entries freely.
# (Not in the menu but still working: /tags/, /rss.xml)
nav:
  - title: blog
    url: /blog/
  - title: linkedin
    url: https://www.linkedin.com/in/chirag-sindhwani-profile/
    external: true
  - title: instagram
    url: https://www.instagram.com/chirag_9.34/
    external: true


# ---------------------------------------------------------------
# Build settings (you normally don't need to touch these)
# ---------------------------------------------------------------
permalink: /:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  footnote_backlink: "↩"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

paginate: 20
paginate_path: "/blog/page/:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

feed:
  path: rss.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
